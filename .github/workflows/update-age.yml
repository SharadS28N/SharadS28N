name: Update Age

on:
schedule:
# Runs every day at 00:00 UTC
- cron: "0 0 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
update-age:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Calculate age
    id: age
    shell: bash
    run: |
      # ============================================
      # CHANGE THIS TO YOUR ACTUAL DATE OF BIRTH
      # Format: YYYY-MM-DD
      # ============================================
      DOB="2006-11-03"

      TODAY=$(date -u +%Y-%m-%d)

      YEAR=$(date -d "$DOB" +%Y)
      MONTH=$(date -d "$DOB" +%m)
      DAY=$(date -d "$DOB" +%d)

      CURRENT_YEAR=$(date -d "$TODAY" +%Y)
      CURRENT_MONTH=$(date -d "$TODAY" +%m)
      CURRENT_DAY=$(date -d "$TODAY" +%d)

      AGE=$((CURRENT_YEAR - YEAR))

      if [[ "$CURRENT_MONTH$CURRENT_DAY" -lt "$MONTH$DAY" ]]; then
        AGE=$((AGE - 1))
      fi

      echo "age=$AGE" >> "$GITHUB_OUTPUT"

  - name: Update README
    shell: bash
    run: |
      AGE="${{ steps.age.outputs.age }}"

      sed -i -E \
        "s/<!-- AGE -->[0-9]+<!-- \\/AGE -->/<!-- AGE -->${AGE}<!-- \\/AGE -->/" \
        README.md

  - name: Commit changes
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add README.md

      if git diff --cached --quiet; then
        echo "Age has not changed."
        exit 0
      fi

      git commit -m "chore: update age"
      git push
```
