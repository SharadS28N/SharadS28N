name: Update GitHub Profile Statistics

on:
schedule:
# Run every day at 00:30 UTC.
- cron: "30 0 * * *"

workflow_dispatch:

push:
paths:
- ".github/workflows/update-profile-stats.yml"

permissions:
contents: write

jobs:
update-stats:
name: Generate GitHub statistics
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Create profile directory
    shell: bash
    run: |
      mkdir -p profile

  # ============================================
  # GitHub Statistics
  # ============================================

  - name: Generate GitHub statistics
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: >-
        username=SharadS28N&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github&include_all_commits=false&count_private=false
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}
      fail_on_error: true

  # ============================================
  # Top Languages
  # ============================================

  - name: Generate top languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: >-
        username=SharadS28N&layout=compact&langs_count=8&hide_border=true&theme=tokyonight&count_private=false
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}
      fail_on_error: true

  # ============================================
  # GitHub Contribution Streak
  # ============================================

  - name: Generate contribution streak
    uses: DenverCoder1/github-readme-streak-stats@main
    with:
      options: >-
        user=SharadS28N&theme=tokyonight&hide_border=true&disable_animations=true&date_format=j%20M%20Y
      path: profile/streak.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Commit generated SVG files
  # ============================================

  - name: Commit updated statistics
    shell: bash
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/stats.svg
      git add profile/top-langs.svg
      git add profile/streak.svg

      if git diff --cached --quiet; then
        echo "Statistics are already up to date."
        exit 0
      fi

      git commit -m "chore: update GitHub profile statistics"
      git push
```
